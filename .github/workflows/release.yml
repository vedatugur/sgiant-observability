name: release

# Tag-driven, and deliberately not push-driven. A published version number can
# never be reused and `npm unpublish` is not an undo, so releasing is an
# explicit act: `git tag v1.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    # Pinned, not `ubuntu-latest`: that label moves to a new Ubuntu on GitHub's
    # schedule, and a publish job should change its OS when this file does.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for npm provenance: npm verifies the package really was built
      # by this workflow, from this repo, at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # v6, not v7, on purpose. v7 stops exporting the placeholder
      # NODE_AUTH_TOKEN that the .npmrc written here still refers to, which
      # changes what npm sees at publish time — and the only way to test that is
      # to publish. v6 runs on Node 24 and leaves the auth path as it was.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; setup-node's Node 20 ships 10.x.
      #
      # Pinned, not `latest`. `latest` became npm 12, which refuses to run on
      # Node 20 at all — so this job would have died here on its next tag,
      # looking like a broken runner rather than a version that moved under it.
      - run: npm install -g npm@11.5.1

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The tag IS the version claim, so disagreeing with package.json means one
      # of the two is wrong and neither should be guessed at.
      - name: the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "REFUSING: tag v$tag but package.json says $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # Same audit as ci.yml, run again here because this is the one job whose
      # mistakes cannot be taken back.
      - name: audit the tarball
        run: |
          npm pack --pack-destination /tmp >/dev/null
          tar xzf /tmp/*.tgz -C /tmp
          ./scripts/audit-tarball.sh /tmp/package

      # NO TOKEN. The job proves its identity to npm over OIDC — npm is told,
      # once, that this repo and this workflow file may publish this package,
      # and the short-lived id-token above is the whole credential.
      #
      # This replaced an NPM_TOKEN secret deliberately. npm is deprecating the
      # 2FA-bypass tokens that automation used to need ("npm tokens that bypass
      # 2FA are being restricted for account changes and direct publishing"),
      # and a long-lived token in a secret is a thing that can leak, expire
      # silently, or outlive the person who made it. This cannot: there is
      # nothing stored to steal.
      #
      # Requires trusted publishing to be configured for the package on
      # npmjs.com, naming this repository and this workflow filename. Until it
      # is, this step fails loudly rather than publishing anything wrong.
      - run: npm publish --provenance --access public
