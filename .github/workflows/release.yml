name: release

# Tag-driven, and deliberately not push-driven. A published version number can
# never be reused and `npm unpublish` is not an undo, so releasing is an
# explicit act: `git tag v1.1.0 && git push --tags`.
#
# The tag has to be on main: one of the commits main itself has pointed at. The
# job refuses, before it installs anything, a tag that is anywhere else; and
# before it publishes, a tag whose name is not the version in package.json.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    # Pinned, not `ubuntu-latest`: that label moves to a new Ubuntu on GitHub's
    # schedule, and a publish job should change its OS when this file does.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for npm provenance: npm verifies the package really was built
      # by this workflow, from this repo, at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # All of history, not the default single commit: the next step asks
          # whether this commit is on main, and one commit cannot answer that.
          fetch-depth: 0

      # THE TAG MUST BE ON MAIN.
      #
      # Everything below checks the tag's NAME against package.json and nothing
      # about WHERE the tag is. A v* tag on a branch, or on a commit that was
      # never merged, would build, pass and publish code that main does not
      # have, under a number that can never be used again. Here, before
      # anything is installed or built, so a misplaced tag costs seconds and
      # spends nothing: delete it, tag main, push again.
      #
      # ON MAIN'S OWN LINE, not merely in its history. This repository
      # squashes today, and a real merge commit is one click away.
      # A commit of a branch that was merged that way is an ancestor of main
      # and was still never main: its tree is the branch's. So the tag has to
      # be one of the commits main itself has pointed at (its first-parent
      # line). For a squashed commit the two are the same thing.
      #
      # main is fetched explicitly rather than trusted from the checkout, so the
      # answer is about main as it is now. The list goes to a file because
      # `rev-list | grep -q` fails under pipefail the moment grep finds its line.
      - name: tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-list --first-parent origin/main > "${RUNNER_TEMP:-/tmp}/main-line"
          if ! grep -qx "$(git rev-parse HEAD)" "${RUNNER_TEMP:-/tmp}/main-line"; then
            echo "REFUSING: $GITHUB_REF_NAME is $(git rev-parse --short HEAD), which is not a commit of main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is $(git rev-parse --short HEAD), on main"

      # v6, not v7, on purpose. v7 stops exporting the placeholder
      # NODE_AUTH_TOKEN that the .npmrc written here still refers to, which
      # changes what npm sees at publish time — and the only way to test that is
      # to publish. v6 runs on Node 24 and leaves the auth path as it was.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; setup-node's Node 20 ships 10.x.
      #
      # Pinned, not `latest`. `latest` became npm 12, which refuses to run on
      # Node 20 at all — so this job would have died here on its next tag,
      # looking like a broken runner rather than a version that moved under it.
      - run: npm install -g npm@11.5.1

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The tag IS the version claim, so disagreeing with package.json means one
      # of the two is wrong and neither should be guessed at.
      - name: the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "REFUSING: tag v$tag but package.json says $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # Same audit as ci.yml, run again here because this is the one job whose
      # mistakes cannot be taken back.
      - name: audit the tarball
        run: |
          npm pack --pack-destination /tmp >/dev/null
          tar xzf /tmp/*.tgz -C /tmp
          ./scripts/audit-tarball.sh /tmp/package

      # NO TOKEN. The job proves its identity to npm over OIDC — npm is told,
      # once, that this repo and this workflow file may publish this package,
      # and the short-lived id-token above is the whole credential.
      #
      # This replaced an NPM_TOKEN secret deliberately. npm is deprecating the
      # 2FA-bypass tokens that automation used to need ("npm tokens that bypass
      # 2FA are being restricted for account changes and direct publishing"),
      # and a long-lived token in a secret is a thing that can leak, expire
      # silently, or outlive the person who made it. This cannot: there is
      # nothing stored to steal.
      #
      # Requires trusted publishing to be configured for the package on
      # npmjs.com, naming this repository and this workflow filename. Until it
      # is, this step fails loudly rather than publishing anything wrong.
      - run: npm publish --provenance --access public
